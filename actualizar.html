<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Actualizar EDUMIND V82</title><style>body{margin:0;display:grid;place-items:center;min-height:100vh;font:600 18px system-ui;background:linear-gradient(125deg,#f0eaff,#e4f8ff);color:#273b72}.card{max-width:620px;margin:22px;background:white;border-radius:27px;padding:28px;box-shadow:0 12px 35px #3b428231}button,a{display:inline-block;background:#6252c8;color:white;padding:13px 19px;border:0;border-radius:13px;font:800 17px system-ui;text-decoration:none;cursor:pointer;margin:7px}p{line-height:1.55}</style></head><body><div class="card"><h1>Actualizar EDUMIND PRIME V82</h1><p>Si ves una versión anterior después de publicarla en GitHub Pages, limpia la caché del sitio. Esta acción no elimina tus archivos del repositorio.</p><button id="clear">Limpiar caché y abrir EDUMIND</button><a href="index.html">Abrir sin limpiar</a><p id="status" role="status"></p></div><script>document.getElementById('clear').onclick=async()=>{document.getElementById('status').textContent='Actualizando…';try{if('serviceWorker'in navigator){for(const reg of await navigator.serviceWorker.getRegistrations())await reg.unregister()}if('caches'in window){for(const name of await caches.keys())await caches.delete(name)}}catch(e){document.getElementById('status').textContent='No fue posible limpiar toda la caché automáticamente.'}location.replace('./index.html?v=80')};</script></body></html>
